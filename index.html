<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EvaluaPro - Plataforma Interactiva</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <!-- jsPDF y AutoTable para reportes ordenados -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <!-- SPINNER -->
  <div id="loader" class="hidden">
    <div class="spinner"></div>
    <p>Procesando...</p>
  </div>

  <!-- INICIO -->
  <div id="view-home" class="view">
    <h1 id="app-title">Plataforma de Evaluación</h1>
    <button onclick="showView('view-student-login')" class="btn primary">Soy Alumno</button>
    <button onclick="showView('view-teacher-login')" class="btn secondary">Soy Docente</button>
  </div>

  <!-- LOGIN DOCENTE -->
  <div id="view-teacher-login" class="view hidden">
    <h2>Acceso Docente</h2>
    <input type="password" id="teacher-pass" placeholder="Contraseña">
    <button onclick="loginTeacher()" class="btn primary">Ingresar</button>
    <button onclick="showView('view-home')" class="btn secondary">Volver</button>
  </div>

  <!-- DASHBOARD DOCENTE -->
  <div id="view-teacher-dashboard" class="view hidden">
    <h2>Crear Nuevo Examen</h2>
    <input type="text" id="exam-code" placeholder="Código de Sala (Ej. SALA01)" required>
    <input type="number" id="exam-time" placeholder="Tiempo en minutos" required>
    
    <div id="questions-container"></div>
    <button onclick="submitExamCreation()" class="btn primary">Crear Sala</button>
    
    <hr style="margin: 30px 0;">
    <h2>Descargar Reportes y Exámenes</h2>
    <input type="text" id="report-code" placeholder="Código de Sala para descargar">
    <button onclick="downloadTeacherReport()" class="btn report-btn">Descargar Reporte PDF (Calificaciones)</button>
    <button onclick="downloadBlankExam()" class="btn secondary" style="background-color: #27ae60; color: white;">Descargar Examen en Blanco (Imprimible)</button>

    <button onclick="showView('view-home')" class="btn secondary" style="margin-top: 20px;">Salir al Inicio</button>
  </div>

  <!-- LOGIN ALUMNO -->
  <div id="view-student-login" class="view hidden">
    <h2>Ingreso al Examen</h2>
    <input type="text" id="student-name" placeholder="Tu Nombre Completo" required>
    <input type="text" id="student-code" placeholder="Código de Sala" required>
    <button onclick="loginStudent()" class="btn primary">Entrar a la Sala</button>
    <button onclick="showView('view-home')" class="btn secondary">Volver</button>
  </div>

  <!-- EXAMEN ALUMNO -->
  <div id="view-exam" class="view hidden">
    <div class="header-exam">
      <h3 id="display-student"></h3>
      <div>
        <span style="font-size: 12px; color: #777;">Tiempo restante:</span>
        <div id="timer" class="timer">--:--</div>
      </div>
    </div>
    
    <div class="progress-bar-container">
      <div id="exam-progress" class="progress-bar"></div>
    </div>

    <!-- El contenedor donde se inyectará 1 pregunta a la vez -->
    <div id="student-questions-container"></div>
    
    <!-- Botones de Navegación Dinámicos -->
    <button id="btn-next-question" onclick="nextQuestion()" class="btn secondary" style="display: none; background-color: #27ae60; color: white;">Siguiente Pregunta ➔</button>
    <button id="btn-finish-exam" onclick="finishExam()" class="btn primary finish-btn" style="display: none;">Finalizar y Enviar Examen</button>
  </div>

  <!-- RESULTADO GIGANTE ALUMNO -->
  <div id="view-result" class="view hidden">
    <h2>¡Evaluación Enviada!</h2>
    <p>Tu calificación automática es:</p>
    <div class="massive-score"><span id="final-score-number"></span> / 20</div>
    <button onclick="showView('view-home')" class="btn secondary">Cerrar Sesión</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
